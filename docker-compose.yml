services:
  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - 9092:9092
      - 9093:9093
  postgres:
    image: postgres:18.1-alpine
    container_name: drsynth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drsynth
      POSTGRES_PASSWORD: drsynth
      POSTGRES_DB: drsynth
    ports:
      - 5432:5432
    volumes:
      - drsynth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drsynth -d drsynth"]
      interval: 10s
      timeout: 30s
      retries: 5
volumes:
  drsynth_pgdata:

#within the Kafka image, for testing create following topics:
#/ $ cd /opt/kafka/bin/
#/opt/kafka/bin $ ./kafka-topics.sh --bootstrap-server localhost:9092 --create --topic audio.raw
