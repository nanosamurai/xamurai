services:
  # -------------------- Kafka (listeners for host + docker network + minikube) --------------------
  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Four client listeners:
      # - INTERNAL: for other containers on the compose network
      # - EXTERNAL: for tools on your host machine (localhost)
      # - MINIKUBE: for pods in minikube talking to Docker-hosted Kafka
      # - DOCKERDESKTOP: for pods in Docker Desktop Kubernetes talking to Docker-hosted Kafka
      #
      # NOTE:
      # Kafka returns broker addresses based on the listener the client connects to.
      # If Docker Desktop k8s connects via the MINIKUBE listener, it will get back
      # host.minikube.internal in metadata (unresolvable in Docker Desktop) -> consumers fail.
      # Therefore we expose a dedicated listener that advertises host.docker.internal.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,MINIKUBE://0.0.0.0:39092,DOCKERDESKTOP://0.0.0.0:49092,CONTROLLER://0.0.0.0:9093
      # IMPORTANT: use 127.0.0.1 for EXTERNAL to avoid client resolving localhost to ::1
      # (we've seen confluent-kafka on Windows try ipv6 first and fail).
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://127.0.0.1:9092,MINIKUBE://host.minikube.internal:39092,DOCKERDESKTOP://host.docker.internal:49092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,MINIKUBE:PLAINTEXT,DOCKERDESKTOP:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

    ports:
      # Security-first default: bind published ports to localhost only.
      # Override with COMPOSE_BIND_IP (e.g. COMPOSE_BIND_IP=0.0.0.0) if you need
      # Docker Desktop k8s pods to reach this from `host.docker.internal`.
      - "${COMPOSE_BIND_IP:-127.0.0.1}:9092:9092"
      - "${COMPOSE_BIND_IP:-127.0.0.1}:39092:39092"
      - "${COMPOSE_BIND_IP:-127.0.0.1}:49092:49092"

  # -------------------- LocalStack (S3 for enrollment, persistent) --------------------
  localstack:
    image: localstack/localstack:latest
    container_name: nanosamurai-localstack
    restart: unless-stopped
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EAGER_SERVICE_LOADING: 1
      PERSISTENCE: 1
      DATA_DIR: /var/lib/localstack
      # used by init script
      XAMURAI_ENROLLMENT_BUCKET: xamurai-enrollment
    volumes:
      - nanosamurai_localstack:/var/lib/localstack
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro

  # -------------------- Postgres --------------------
  postgres:
    image: postgres:18.1-alpine
    container_name: nanosamurai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drsynth
      POSTGRES_PASSWORD: drsynth
      POSTGRES_DB: nanosamurai
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - nanosamurai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drsynth -d nanosamurai"]
      interval: 10s
      timeout: 30s
      retries: 5

  kafka_init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      - broker
    restart: "no"
    # NOTE: Use exec-form with a single script string; otherwise Compose may split args
    # and the container will only run `set` (printing env) instead of the full script.
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        echo "Waiting for Kafka to become reachable..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --list >/dev/null 2>&1; do
          sleep 2
        done

        echo "Creating topics (idempotent)..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --create --if-not-exists --topic audio.raw --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --create --if-not-exists --topic transcripts.refined --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --create --if-not-exists --topic recordings.finished --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --create --if-not-exists --topic transcripts.final --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --create --if-not-exists --topic transcripts.persistor.dlq --partitions 1 --replication-factor 1

        echo "Kafka topics created."

  # -------------------- DB migrations + seed (Postgres init) --------------------
  #
  # NOTE: We intentionally run SQL migrations via `psql` here (instead of Migratus)
  # because Migratus treats multi-statement SQL files as batched statements and can
  # fail with errors like "Too many update results were returned".
  #
  # The SQL migration files are vendored from `samuraipersistor` into:
  #   docker/postgres/migrations/
  db_migrate:
    image: postgres:18.1-alpine
    container_name: nanosamurai-db-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: drsynth
    volumes:
      - ./docker/postgres/migrations:/migrations:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e

        # Idempotency: if schema already exists, do nothing.
        if psql -h postgres -U drsynth -d nanosamurai -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='tenants'" | grep -q 1; then
          echo "Schema already initialized; skipping migrations."
          exit 0
        fi

        echo "Applying SQL migrations..."
        psql -h postgres -U drsynth -d nanosamurai -v ON_ERROR_STOP=1 -f /migrations/001-create-core-schema.up.sql
        psql -h postgres -U drsynth -d nanosamurai -v ON_ERROR_STOP=1 -f /migrations/002-transcript-records-append-only.up.sql
        echo "Migrations complete."

  db_seed:
    image: postgres:18.1-alpine
    container_name: nanosamurai-db-seed
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: drsynth
    volumes:
      - ./docker/postgres/seed.sql:/seed.sql:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e

        # Idempotency: if dev tenant exists, do nothing.
        if psql -h postgres -U drsynth -d nanosamurai -tAc "SELECT 1 FROM tenants WHERE id='00000000-0000-0000-0000-000000000000'" | grep -q 1; then
          echo "Dev tenant already seeded; skipping."
          exit 0
        fi

        echo "Seeding dev tenant/user..."
        psql -h postgres -U drsynth -d nanosamurai -v ON_ERROR_STOP=1 -f /seed.sql
        echo "Seed complete."

  # --------- xamurai services (built from this monorepo) ---------

  rtservice:
    build:
      context: .
      dockerfile: rtservice/Dockerfile
    image: xamurai-rtservice:local
    container_name: xamurai-rtservice
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      KAFKA_TOPIC_AUDIO: audio.raw
      RT_GRPC_PORT: 50052
      # Required: provide via environment or .env file
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in your environment}
      # HuggingFace cache location (container runs as non-root user)
      HF_HOME: /data/hf_cache

      # Enrollment (multi-tenant, S3-backed)
      ENROLL_BACKEND: s3_manifest
      ENROLL_S3_ENDPOINT: http://localstack:4566
      ENROLL_S3_BUCKET: xamurai-enrollment
      ENROLL_S3_PREFIX: enrollment
      ENROLL_S3_REGION: us-east-1
      ENROLL_S3_ACCESS_KEY: test
      ENROLL_S3_SECRET_KEY: test
      ENROLL_S3_FORCE_PATH_STYLE: "true"

      # Optional legacy dev path
      ENROLL_DIR: /app/enrolled_speakers
      FW_LANG_DEFAULT: ""

      # --- Plan C: rtservice cumulative refinement defaults ---
      # These are OPTIONAL defaults (can also be overridden per-session via
      # gRPC metadata headers passed by samuraibff).
      #
      # Disable partials globally (if needed during rollout):
      #   RT_PARTIAL_ENABLE: "false"
      # IMPORTANT: do not include quotes inside the ${...:-default} expression,
      # otherwise the env var value will contain literal quote characters.
      RT_PARTIAL_ENABLE: ${RT_PARTIAL_ENABLE:-true}
      RT_EMIT_EVERY_SEC: ${RT_EMIT_EVERY_SEC:-0.7}
      RT_WINDOW_SEC: ${RT_WINDOW_SEC:-5.0}
      RT_OVERLAP_SEC: ${RT_OVERLAP_SEC:-0.5}
      RT_PARTIAL_MIN_BUFFER_SEC: ${RT_PARTIAL_MIN_BUFFER_SEC:-0.7}
      RT_PARTIAL_LOOKBACK_SEC: ${RT_PARTIAL_LOOKBACK_SEC:-2.0}
      RT_PARTIAL_MODE: ${RT_PARTIAL_MODE:-cumulative}
      RT_PARTIAL_MIN_TRANSCRIBE_SEC: ${RT_PARTIAL_MIN_TRANSCRIBE_SEC:-1.5}
      RT_PARTIAL_STABILITY_REPEATS: ${RT_PARTIAL_STABILITY_REPEATS:-1}

      # Overload protection: skip PARTIALs when behind realtime.
      RT_PARTIAL_MAX_BEHIND_SEC: ${RT_PARTIAL_MAX_BEHIND_SEC:-2.0}
      RT_PARTIAL_IDLE_RESET_SEC: ${RT_PARTIAL_IDLE_RESET_SEC:-3.0}

    # --- GPU (optional) ---
    # If you have NVIDIA GPU support configured in Docker, uncomment this to
    # make torch.cuda.is_available() return true.
    #
    # For Docker Desktop on Windows this typically requires:
    # - WSL2 backend
    # - NVIDIA drivers installed on the host
    # - nvidia-container-toolkit available to Docker
    #
    # gpus: all
    # Persist HF caches so the *first* startup is slow, subsequent restarts are fast.
    volumes:
      - nanosamurai_hf_cache:/data/hf_cache
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:50052:50052"
    depends_on:
      kafka_init:
        condition: service_completed_successfully

  whisperx_worker:
    build:
      context: .
      dockerfile: whisperx_worker/Dockerfile
    image: xamurai-whisperx-worker:local
    container_name: xamurai-whisperx-worker
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      KAFKA_TOPIC_AUDIO: audio.raw
      KAFKA_TOPIC_REFINED: transcripts.refined
      KAFKA_GROUP_ID: whisperx-async
      # Required for diarization (pyannote). Without this, the worker will emit speaker="".
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in your environment}
      # HuggingFace cache location (container runs as non-root user)
      HF_HOME: /data/hf_cache
      WHISPERX_SLICE_SECONDS: "60.0"
      WHISPERX_IDLE_SECONDS: "30.0"
      WHISPERX_COMPUTE_TYPE: ""

      # Phase 2: decouple Kafka polling from inference (keeps consumer responsive
      # even when WhisperX is slow).
      WHISPERX_DECOUPLE_IO: ${WHISPERX_DECOUPLE_IO:-false}

      # Commit offsets only after producing refined events (safer; can reprocess
      # after crash).
      WHISPERX_COMMIT_AFTER_PRODUCE: ${WHISPERX_COMMIT_AFTER_PRODUCE:-true}

      # Scheduler-level dynamic batching knobs (currently sequential execution,
      # but collecting jobs is already supported).
      WHISPERX_BATCH_MAX_ITEMS: ${WHISPERX_BATCH_MAX_ITEMS:-1}
      WHISPERX_BATCH_MAX_WAIT_MS: ${WHISPERX_BATCH_MAX_WAIT_MS:-30}
      WHISPERX_BATCH_MODE: ${WHISPERX_BATCH_MODE:-sequential}

      # Enrollment (multi-tenant, S3-backed)
      ENROLL_BACKEND: s3_manifest
      ENROLL_S3_ENDPOINT: http://localstack:4566
      ENROLL_S3_BUCKET: xamurai-enrollment
      ENROLL_S3_PREFIX: enrollment
      ENROLL_S3_REGION: us-east-1
      ENROLL_S3_ACCESS_KEY: test
      ENROLL_S3_SECRET_KEY: test
      ENROLL_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - nanosamurai_hf_cache:/data/hf_cache
    depends_on:
      kafka_init:
        condition: service_completed_successfully

  recorder_worker:
    build:
      context: .
      dockerfile: recorder_worker/Dockerfile
    image: xamurai-recorder-worker:local
    container_name: xamurai-recorder-worker
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      KAFKA_TOPIC_AUDIO: audio.raw
      KAFKA_TOPIC_RECORDING_FINISHED: recordings.finished
      KAFKA_GROUP_ID_RECORDER: recorder-worker
      RECORDER_IDLE_SECONDS: "30.0"
      RECORDING_STORAGE_BACKEND: local
      RECORDING_DIR: /data/recordings
      # S3 vars (only used if RECORDING_STORAGE_BACKEND=s3)
      S3_ENDPOINT: ""
      S3_BUCKET: ""
      S3_REGION: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_FORCE_PATH_STYLE: "true"
      S3_PREFIX: ""
    volumes:
      - nanosamurai_recordings:/data/recordings
    depends_on:
      kafka_init:
        condition: service_completed_successfully

  finalizer_worker:
    build:
      context: .
      dockerfile: finalizer_worker/Dockerfile
    image: xamurai-finalizer-worker:local
    container_name: xamurai-finalizer-worker
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      KAFKA_TOPIC_RECORDING_FINISHED: recordings.finished
      KAFKA_TOPIC_TRANSCRIPTS_FINAL: transcripts.final
      KAFKA_GROUP_ID_FINALIZER: finalizer-worker
      # Required for diarization (pyannote). Without this, the worker will emit speaker="".
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in your environment}
      # HuggingFace cache location (container runs as non-root user)
      HF_HOME: /data/hf_cache

      # Enrollment (multi-tenant, S3-backed)
      ENROLL_BACKEND: s3_manifest
      ENROLL_S3_ENDPOINT: http://localstack:4566
      ENROLL_S3_BUCKET: xamurai-enrollment
      ENROLL_S3_PREFIX: enrollment
      ENROLL_S3_REGION: us-east-1
      ENROLL_S3_ACCESS_KEY: test
      ENROLL_S3_SECRET_KEY: test
      ENROLL_S3_FORCE_PATH_STYLE: "true"

      # Uses file:// URLs so it needs the same volume as recorder_worker
      RECORDINGS_DIR: /data/recordings
      # Allow long processing time per message (full session + model downloads)
      FINALIZER_MAX_POLL_INTERVAL_MS: "3600000"
    volumes:
      - nanosamurai_recordings:/data/recordings
      - nanosamurai_hf_cache:/data/hf_cache
    depends_on:
      kafka_init:
        condition: service_completed_successfully

  # -------------------- samuraibff (Clojure BFF + UI) --------------------

  samuraibff:
    build:
      context: ${SAMURAIBFF_PATH:-../../IdeaProjects/samuraibff}
      dockerfile: Dockerfile
    image: samuraibff:local
    container_name: samuraibff
    restart: unless-stopped
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:8000:8000"
    environment:
      SAMURAIBFF_HTTP_HOST: 0.0.0.0
      SAMURAIBFF_HTTP_PORT: 8000

      # Enrollment storage (LocalStack S3)
      SAMURAIBFF_S3_ENDPOINT: http://localstack:4566
      SAMURAIBFF_S3_BUCKET: xamurai-enrollment
      SAMURAIBFF_S3_ENROLLMENT_PREFIX: enrollment
      SAMURAIBFF_S3_REGION: us-east-1
      SAMURAIBFF_S3_ACCESS_KEY: test
      SAMURAIBFF_S3_SECRET_KEY: test
      SAMURAIBFF_S3_FORCE_PATH_STYLE: "true"

      SAMURAIBFF_DB_JDBC_URL: jdbc:postgresql://postgres:5432/nanosamurai
      SAMURAIBFF_DB_USERNAME: drsynth
      SAMURAIBFF_DB_PASSWORD: drsynth

      SAMURAIBFF_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SAMURAIBFF_GRPC_RTSERVICE_ADDR: rtservice:50052

      # Auth disabled by default for local stack testing.
      # If you want auth locally, point issuer to your Keycloak dev profile.
      SAMURAIBFF_AUTH_REQUIRED: ${SAMURAIBFF_AUTH_REQUIRED:-false}
      # When auth is disabled, we still want tenant isolation + enrollment lookup.
      # This value is ONLY used when SAMURAIBFF_AUTH_REQUIRED=false.
      SAMURAIBFF_AUTH_GUEST_TENANT_ID: ${SAMURAIBFF_AUTH_GUEST_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      # Default to the shared dev Keycloak running in ECS.
      # Override in your environment/.env if needed.
      SAMURAIBFF_AUTH_ISSUER: ${SAMURAIBFF_AUTH_ISSUER:-https://auth.nanosamur.ai/realms/nanosamurai}
      SAMURAIBFF_AUTH_AUDIENCE: bff-web
      SAMURAIBFF_AUTH_CLIENT_ID: bff-web

      # For single-node local dev, origin uri is localhost.
      SAMURAIBFF_ORIGIN_URI: http://localhost:8000

    depends_on:
      kafka_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
      db_seed:
        condition: service_completed_successfully
      rtservice:
        condition: service_started

  # -------------------- samuraipersistor (Kafka -> Postgres) --------------------

  samuraipersistor:
    image: samuraipersistor:local
    build:
      context: ${SAMURAIPERSISTOR_PATH:-../../IdeaProjects/samuraipersistor}
      dockerfile: Dockerfile
    container_name: samuraipersistor
    restart: unless-stopped
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:8010:8010"
    environment:
      SP_HTTP_HOST: 0.0.0.0
      SP_HTTP_PORT: 8010

      SP_DB_JDBC_URL: jdbc:postgresql://postgres:5432/nanosamurai
      SP_DB_USERNAME: drsynth
      SP_DB_PASSWORD: drsynth

      SP_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SP_KAFKA_TOPIC_REFINED: transcripts.refined
      SP_KAFKA_TOPIC_FINAL: transcripts.final
      SP_KAFKA_TOPIC_DLQ: transcripts.persistor.dlq

    depends_on:
      kafka_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully

volumes:
  nanosamurai_pgdata:
  nanosamurai_recordings:
  nanosamurai_hf_cache:
  nanosamurai_localstack:

# Within the Kafka image, for testing create following topics:
#/ $ cd /opt/kafka/bin/
#/opt/kafka/bin $ ./kafka-topics.sh --bootstrap-server localhost:9092 --create --topic audio.raw
#/opt/kafka/bin $ ./kafka-topics.sh --bootstrap-server localhost:9092 --create --topic transcripts.refined
