# Local dev values for OpenTelemetry Collector
# Namespace: observability
#
# This is the central OTLP receiver. Export traces to Tempo.
# We keep metrics/logs out of this for now (Prometheus scrapes directly; Alloy ships logs).

mode: deployment

image:
  repository: "otel/opentelemetry-collector-k8s"
  # Leave tag empty to use chart default.
  tag: ""

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true

    # Useful during initial bring-up; can be removed later.
    logging:
      verbosity: normal

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo, logging]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: null
    protocol: TCP

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: null
    protocol: TCP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
