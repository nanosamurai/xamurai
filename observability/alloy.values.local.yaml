# Local dev values for Grafana Alloy
# Namespace: observability
#
# This is a DaemonSet that tails container logs from the node and ships them to Loki.
#
# Alloy config language: River (https://grafana.com/docs/alloy/latest/)

controller:
  type: daemonset

alloy:
  configMap:
    create: true
    content: |
      // Discover pods
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Tail pod logs and attach useful labels.
      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // Basic processing/relabeling.
      loki.process "pods" {
        stage.static_labels {
          values = {
            cluster = "local",
          }
        }

        // Keep the most useful k8s labels.
        stage.labels {
          values = {
            namespace = "namespace",
            pod       = "pod",
            container = "container",
            job       = "job",
          }
        }

        forward_to = [loki.write.default.receiver]
      }

      // Push to Loki gateway
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
      }

rbac:
  create: true

serviceAccount:
  create: true
