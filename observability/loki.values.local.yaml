# Local dev values for Grafana Loki
# Namespace: observability

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

# Run Loki as a single binary deployment.
deploymentMode: SingleBinary

singleBinary:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# No persistence for local; OK to lose logs on restart.
persistence:
  enabled: false

# Keep gateway enabled because many agents default to pushing through it.
gateway:
  enabled: true
