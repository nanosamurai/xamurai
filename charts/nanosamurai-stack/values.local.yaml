# Backwards-compat alias (historical file name).
# Prefer using one of:
# - values.local.docker-desktop.yaml
# - values.local.minikube.yaml
#
# For now, keep this file as the minikube defaults.

infra:
  kafkaBootstrapServers: "host.minikube.internal:39092"
  postgresJdbcUrl: "jdbc:postgresql://host.minikube.internal:5432/nanosamurai"

rtservice:
  hfToken: "${HF_TOKEN}"

  gpu:
    enabled: false

whisperxWorker:
  gpu:
    enabled: false

finalizerWorker:
  gpu:
    enabled: false

recordings:
  hostPath: "/data/nanosamurai-recordings"
  pvc:
    enabled: false
