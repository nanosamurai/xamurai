# nanosamurai-stack
#
# Default values are intentionally conservative and CPU-first.
# Local environments should use an overlay values file:
# - values.local.docker-desktop.yaml
# - values.local.minikube.yaml
#
# Notes:
# - This chart is intended to deploy *apps*. Infra (Kafka/Postgres/Keycloak) is external by default.
# - GPU scheduling via `nvidia.com/gpu` is optional and may not work on WSL2-based local clusters.

infra:
  # Bootstrap servers as seen from pods.
  kafkaBootstrapServers: ""

  # JDBC URL as seen from pods.
  postgresJdbcUrl: ""
  postgresUser: "drsynth"
  postgresPassword: "drsynth"

images:
  pullPolicy: IfNotPresent

  samuraibff:
    repository: "samuraibff"
    tag: "local"

  samuraipersistor:
    repository: "samuraipersistor"
    tag: "local"

  rtservice:
    repository: "drsynth-rtservice"
    tag: "dev"

  whisperxWorker:
    repository: "drsynth-whisperx-worker"
    tag: "dev"

  recorderWorker:
    repository: "drsynth-recorder-worker"
    tag: "dev"

  finalizerWorker:
    repository: "drsynth-finalizer-worker"
    tag: "dev"

# Enrollment reader configuration (rtservice/whisperx/finalizer)
#
# This controls how transcription services resolve per-tenant enrolled speakers.
#
# Supported backends:
# - legacy_dir: load a flat local folder (dev-only)
# - local_manifest: read per-tenant manifests from a shared filesystem
# - s3_manifest: read per-tenant manifests + samples from S3/S3-compatible storage
#
# Env vars emitted into pods:
# - ENROLL_BACKEND
# - ENROLL_DIR (legacy_dir/local_manifest)
# - ENROLL_S3_* (s3_manifest)
# - ENROLL_CACHE_* (optional)

enrollment:
  backend: "legacy_dir"

  # Used when backend is legacy_dir or local_manifest
  dir: "/app/enrolled_speakers"

  cache:
    ttlSeconds: 300
    maxTenants: 128

  s3:
    bucket: ""
    prefix: "enrollment"
    region: ""
    endpoint: ""
    forcePathStyle: true

    credentialsSecret:
      name: ""
      accessKeyKey: "accessKey"
      secretKeyKey: "secretKey"

bff:
  enabled: true

  replicas: 1
  service:
    # Security-first default: keep the Service internal and access it via
    # `kubectl port-forward`. NodePort is supported but must be an explicit opt-in.
    type: ClusterIP
    port: 8000
    # Only used when `type: NodePort`.
    nodePort: 30080

  probes:
    readinessPath: "/ready"
    livenessPath: "/health"

  originUri: "http://localhost:8000"

  auth:
    required: false
    issuer: "https://auth.nanosamur.ai/realms/nanosamurai"

  # rtservice can be deployed in-cluster (default) or external (e.g. docker compose)
  rtservice:
    inCluster: true
    externalGrpcAddr: "host.docker.internal:50052"

  # Enrolled speakers (S3 / S3-compatible)
  # Used by samuraibff to store speaker enrollment manifests and WAV samples.
  s3:
    bucket: ""
    enrollmentPrefix: "enrollment"
    region: ""
    endpoint: ""
    # For LocalStack/MinIO you typically want this true.
    forcePathStyle: true

    # Secret holding S3 credentials (accessKey/secretKey). Use an existing Secret.
    credentialsSecret:
      name: ""
      accessKeyKey: "accessKey"
      secretKeyKey: "secretKey"

persistor:
  enabled: true

  replicas: 1
  service:
    type: ClusterIP
    port: 8010

  probes:
    readinessPath: "/ready"
    livenessPath: "/health"

rtservice:
  enabled: true

  replicas: 1

  # rtservice can take a long time to start on cold caches (model downloads / initialization).
  # The default deployment progress deadline (600s) can be too short for local clusters.
  progressDeadlineSeconds: 600

  service:
    type: ClusterIP
    port: 50052

  # rtservice can take a long time to start (model downloads / initialization).
  # Use a startupProbe to prevent the liveness probe from killing it during warmup.
  startupProbe:
    periodSeconds: 10
    failureThreshold: 120 # ~20 minutes
    timeoutSeconds: 1

  # HF token is required for pyannote downloads.
  #
  # Security note:
  # - Prefer providing the token via an existing Kubernetes Secret (hfTokenSecret)
  #   rather than putting it directly into Helm values.
  hfToken: ""

  # Optional: reference an existing Secret containing HF_TOKEN.
  # If set, the chart will NOT create its own Secret.
  hfTokenSecret:
    name: ""
    key: "HF_TOKEN"

  gpu:
    enabled: false
    count: 1

whisperxWorker:
  enabled: true

  replicas: 1
  gpu:
    enabled: false
    count: 1

recorderWorker:
  enabled: true

  replicas: 1

finalizerWorker:
  enabled: true

  replicas: 1
  gpu:
    enabled: false
    count: 1

# Optional shared HuggingFace cache to avoid re-downloading models on each restart.
#
# Recommended for local clusters (Docker Desktop / minikube). If disabled, pods will
# download models into the container filesystem which is lost on restart.
hfCache:
  enabled: false

  pvc:
    # Create a PVC named <release>-hf-cache-pvc.
    enabled: true
    # Leave empty to use the cluster default storage class.
    storageClassName: ""
    # Adjust to your needs; Whisper/pyannote/WhisperX caches can be many GB.
    size: 20Gi
    accessModes:
      - ReadWriteOnce

  # Mounted into model-downloading pods (rtservice/whisperx/finalizer).
  mountPath: "/data/hf_cache"

recordings:
  # In Kubernetes, recorder + finalizer must share the same storage.
  #
  # Supported options:
  # - hostPath (minikube-friendly): set `hostPath` to a non-empty path.
  # - PVC (recommended default): set `pvc.enabled=true` and optionally `pvc.storageClassName`.
  hostPath: ""

  pvc:
    enabled: true
    # Leave empty to use the cluster default storage class.
    storageClassName: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  mountPath: "/data/recordings"
