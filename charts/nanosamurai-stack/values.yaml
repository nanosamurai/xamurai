# nanosamurai-stack
#
# Default values are intentionally conservative and CPU-first.
# Local environments should use an overlay values file:
# - values.local.docker-desktop.yaml
# - values.local.minikube.yaml
#
# Notes:
# - This chart is intended to deploy *apps*. Infra (Kafka/Postgres/Keycloak) is external by default.
# - GPU scheduling via `nvidia.com/gpu` is optional and may not work on WSL2-based local clusters.

infra:
  # Bootstrap servers as seen from pods.
  kafkaBootstrapServers: ""

  # JDBC URL as seen from pods.
  postgresJdbcUrl: ""
  postgresUser: "drsynth"
  postgresPassword: "drsynth"

images:
  pullPolicy: IfNotPresent

  samuraibff:
    repository: "samuraibff"
    tag: "local"

  samuraipersistor:
    repository: "samuraipersistor"
    tag: "local"

  rtservice:
    repository: "drsynth-rtservice"
    tag: "dev"

  whisperxWorker:
    repository: "drsynth-whisperx-worker"
    tag: "dev"

  recorderWorker:
    repository: "drsynth-recorder-worker"
    tag: "dev"

  finalizerWorker:
    repository: "drsynth-finalizer-worker"
    tag: "dev"

bff:
  enabled: true

  replicas: 1
  service:
    type: NodePort
    port: 8000
    nodePort: 30080

  originUri: "http://localhost:8000"

  auth:
    required: false
    issuer: "https://auth.nanosamur.ai/realms/nanosamurai"

  # rtservice can be deployed in-cluster (default) or external (e.g. docker compose)
  rtservice:
    inCluster: true
    externalGrpcAddr: "host.docker.internal:50052"

persistor:
  enabled: true

  replicas: 1
  service:
    type: ClusterIP
    port: 8010

rtservice:
  enabled: true

  replicas: 1
  service:
    type: ClusterIP
    port: 50052

  # HF token is required for pyannote downloads.
  hfToken: ""

  gpu:
    enabled: false
    count: 1

whisperxWorker:
  enabled: true

  replicas: 1
  gpu:
    enabled: false
    count: 1

recorderWorker:
  enabled: true

  replicas: 1

finalizerWorker:
  enabled: true

  replicas: 1
  gpu:
    enabled: false
    count: 1

recordings:
  # In Kubernetes, recorder + finalizer must share the same storage.
  #
  # Supported options:
  # - hostPath (minikube-friendly): set `hostPath` to a non-empty path.
  # - PVC (recommended default): set `pvc.enabled=true` and optionally `pvc.storageClassName`.
  hostPath: ""

  pvc:
    enabled: true
    # Leave empty to use the cluster default storage class.
    storageClassName: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  mountPath: "/data/recordings"
