# Local overrides for Docker Desktop Kubernetes (Windows)
#
# Assumptions:
# - Infra (Kafka/Postgres/Keycloak) is running via docker compose on the host.
# - Kubernetes pods can reach the host via host.docker.internal.

infra:
  # IMPORTANT: must match Kafka advertised listener for Docker Desktop Kubernetes.
  kafkaBootstrapServers: "host.docker.internal:49092"
  postgresJdbcUrl: "jdbc:postgresql://host.docker.internal:5432/drsynth"

# Images must exist in the Docker Desktop engine (no registry pull). These tags
# match the repo's suggested local build commands.
images:
  rtservice:
    repository: "drsynth-rtservice"
    tag: "local"
  whisperxWorker:
    repository: "drsynth-whisperx-worker"
    tag: "local"
  recorderWorker:
    repository: "drsynth-recorder-worker"
    tag: "local"
  finalizerWorker:
    repository: "drsynth-finalizer-worker"
    tag: "local"

recordings:
  hostPath: ""
  pvc:
    enabled: true

rtservice:
  # Required: set this before installing the chart.
  # Example: helm ... --set rtservice.hfToken="$HF_TOKEN"
  hfToken: ""

  gpu:
    enabled: false

# Override probe paths for local convenience.
#
# NOTE: /ready currently returns 503 for local k8s because it depends on rtservice
# readiness, which may take a long time (model warmup). Using /health makes pods
# become Ready earlier so Helm --wait and Services work.
#
# Keep /ready for prod/staging.
bff:
  probes:
    readinessPath: "/health"

persistor:
  probes:
    readinessPath: "/health"

whisperxWorker:
  gpu:
    enabled: false

finalizerWorker:
  gpu:
    enabled: false
