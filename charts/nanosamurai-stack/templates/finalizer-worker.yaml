{{- if .Values.finalizerWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nanosamurai-stack.fullname" . }}-finalizer-worker
  labels:
    {{- include "nanosamurai-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: finalizer-worker
spec:
  replicas: {{ .Values.finalizerWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: finalizer-worker
  template:
    metadata:
      labels:
        {{- include "nanosamurai-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: finalizer-worker
    spec:
      containers:
        - name: finalizer-worker
          image: "{{ .Values.images.finalizerWorker.repository }}:{{ .Values.images.finalizerWorker.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.infra.kafkaBootstrapServers | quote }}

            # Security: disable pyannote.audio telemetry/metrics exporter.
            - name: PYANNOTE_METRICS_ENABLED
              value: "0"

            {{- if .Values.observability.enabled }}
            - name: OTEL_SERVICE_NAME
              value: "finalizer-worker"
            {{- include "nanosamurai-stack.otelCommonEnv" . | nindent 12 }}
            {{- end }}

            {{- if .Values.hfCache.enabled }}
            - name: HF_HOME
              value: {{ .Values.hfCache.mountPath | quote }}
            {{- end }}

            {{- if .Values.rtservice.hfTokenSecret.name }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rtservice.hfTokenSecret.name | quote }}
                  key: {{ .Values.rtservice.hfTokenSecret.key | default "HF_TOKEN" | quote }}
            {{- else if .Values.rtservice.hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nanosamurai-stack.fullname" . }}-secrets
                  key: HF_TOKEN
            {{- end }}

            - name: KAFKA_TOPIC_RECORDING_FINISHED
              value: "recordings.finished"
            - name: KAFKA_TOPIC_TRANSCRIPTS_FINAL
              value: "transcripts.final"
            - name: KAFKA_GROUP_ID_FINALIZER
              value: "finalizer-worker"
            - name: RECORDINGS_DIR
              value: {{ .Values.recordings.mountPath | quote }}

            {{- include "nanosamurai-stack.enrollmentEnv" . | nindent 12 }}

          volumeMounts:
            - name: recordings
              mountPath: {{ .Values.recordings.mountPath | quote }}
            {{- if .Values.hfCache.enabled }}
            - name: hf-cache
              mountPath: {{ .Values.hfCache.mountPath | quote }}
            {{- end }}

          {{- if and .Values.finalizerWorker.gpu.enabled (gt (int .Values.finalizerWorker.gpu.count) 0) }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.finalizerWorker.gpu.count }}
          {{- end }}
      volumes:
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ include "nanosamurai-stack.fullname" . }}-recordings-pvc
        {{- if .Values.hfCache.enabled }}
        - name: hf-cache
          persistentVolumeClaim:
            claimName: {{ include "nanosamurai-stack.fullname" . }}-hf-cache-pvc
        {{- end }}
{{- end }}
