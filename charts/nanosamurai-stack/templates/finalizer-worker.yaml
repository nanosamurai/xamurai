{{- if .Values.finalizerWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nanosamurai-stack.fullname" . }}-finalizer-worker
  labels:
    {{- include "nanosamurai-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: finalizer-worker
spec:
  replicas: {{ .Values.finalizerWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: finalizer-worker
  template:
    metadata:
      labels:
        {{- include "nanosamurai-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: finalizer-worker
    spec:
      containers:
        - name: finalizer-worker
          image: "{{ .Values.images.finalizerWorker.repository }}:{{ .Values.images.finalizerWorker.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.infra.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC_RECORDING_FINISHED
              value: "recordings.finished"
            - name: KAFKA_TOPIC_TRANSCRIPTS_FINAL
              value: "transcripts.final"
            - name: KAFKA_GROUP_ID_FINALIZER
              value: "finalizer-worker"
            - name: RECORDINGS_DIR
              value: {{ .Values.recordings.mountPath | quote }}

          volumeMounts:
            - name: recordings
              mountPath: {{ .Values.recordings.mountPath | quote }}

          {{- if and .Values.finalizerWorker.gpu.enabled (gt (int .Values.finalizerWorker.gpu.count) 0) }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.finalizerWorker.gpu.count }}
          {{- end }}
      volumes:
        - name: recordings
          persistentVolumeClaim:
            name: {{ include "nanosamurai-stack.fullname" . }}-recordings-pvc
{{- end }}
