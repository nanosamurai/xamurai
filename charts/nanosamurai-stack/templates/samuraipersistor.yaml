{{- if .Values.persistor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nanosamurai-stack.fullname" . }}-persistor
  labels:
    {{- include "nanosamurai-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: persistor
spec:
  replicas: {{ .Values.persistor.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: persistor
  template:
    metadata:
      labels:
        {{- include "nanosamurai-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: persistor
    spec:
      {{- include "nanosamurai-stack.otelJavaAgentInit" . | nindent 6 }}
      containers:
        - name: samuraipersistor
          image: "{{ .Values.images.samuraipersistor.repository }}:{{ .Values.images.samuraipersistor.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8010
          env:
            - name: SP_HTTP_HOST
              value: "0.0.0.0"
            - name: SP_HTTP_PORT
              value: "8010"

            {{- if .Values.observability.enabled }}
            - name: OTEL_SERVICE_NAME
              value: "samuraipersistor"
            {{- include "nanosamurai-stack.otelCommonEnv" . | nindent 12 }}
            {{- include "nanosamurai-stack.otelJavaAgentEnv" . | nindent 12 }}
            {{- end }}

            - name: SP_DB_JDBC_URL
              value: {{ .Values.infra.postgresJdbcUrl | quote }}
            - name: SP_DB_USERNAME
              value: {{ .Values.infra.postgresUser | quote }}
            - name: SP_DB_PASSWORD
              value: {{ .Values.infra.postgresPassword | quote }}

            - name: SP_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.infra.kafkaBootstrapServers | quote }}
            - name: SP_KAFKA_TOPIC_REFINED
              value: "transcripts.refined"
            - name: SP_KAFKA_TOPIC_FINAL
              value: "transcripts.final"
            - name: SP_KAFKA_TOPIC_DLQ
              value: "transcripts.persistor.dlq"

          # Persistor can take a bit to warm up (DB + Kafka connections).
          # Use a startupProbe so the liveness probe doesn't kill it prematurely.
          startupProbe:
            httpGet:
              path: {{ .Values.persistor.probes.livenessPath | default "/health" | quote }}
              port: http
            periodSeconds: 5
            failureThreshold: 60 # ~5 minutes

          readinessProbe:
            httpGet:
              path: {{ .Values.persistor.probes.readinessPath | default "/ready" | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.persistor.probes.livenessPath | default "/health" | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          {{- if and .Values.observability.enabled .Values.observability.javaAgent.enabled }}
          volumeMounts:
            {{- include "nanosamurai-stack.otelJavaAgentVolumeMount" . | nindent 12 }}
          {{- end }}

      {{- if and .Values.observability.enabled .Values.observability.javaAgent.enabled }}
      volumes:
        {{- include "nanosamurai-stack.otelJavaAgentVolume" . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nanosamurai-stack.fullname" . }}-persistor
  labels:
    {{- include "nanosamurai-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: persistor
spec:
  type: {{ .Values.persistor.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: persistor
  ports:
    - name: http
      port: {{ .Values.persistor.service.port }}
      targetPort: http
{{- end }}
