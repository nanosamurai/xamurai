{{- if .Values.rtservice.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nanosamurai-stack.fullname" . }}-rtservice
  labels:
    {{- include "nanosamurai-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: rtservice
spec:
  progressDeadlineSeconds: {{ .Values.rtservice.progressDeadlineSeconds | default 600 }}
  replicas: {{ .Values.rtservice.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rtservice
  template:
    metadata:
      labels:
        {{- include "nanosamurai-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: rtservice
    spec:
      containers:
        - name: rtservice
          image: "{{ .Values.images.rtservice.repository }}:{{ .Values.images.rtservice.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50052
            {{- if .Values.rtservice.observability.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.rtservice.observability.metrics.port | default 8008 }}
            {{- end }}
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.infra.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC_AUDIO
              value: "audio.raw"
            - name: RT_GRPC_PORT
              value: "50052"

            - name: RT_GRPC_MAX_WORKERS
              value: {{ .Values.rtservice.grpc.maxWorkers | default 8 | quote }}

            {{- if .Values.rtservice.observability.crashDiagnostics.faulthandlerEnabled }}
            - name: RT_FAULTHANDLER_ENABLE
              value: "true"
            {{- else }}
            - name: RT_FAULTHANDLER_ENABLE
              value: "false"
            {{- end }}

            {{- if .Values.rtservice.observability.metrics.enabled }}
            - name: RT_METRICS_ENABLE
              value: "true"
            - name: RT_METRICS_PORT
              value: {{ .Values.rtservice.observability.metrics.port | default 8008 | quote }}
            # Bind to localhost inside the pod by default (security-first).
            - name: RT_METRICS_ADDR
              value: "0.0.0.0"
            {{- else }}
            - name: RT_METRICS_ENABLE
              value: "false"
            {{- end }}

            # --- Plan C: rtservice cumulative refinement defaults ---
            - name: RT_PARTIAL_ENABLE
              value: {{ .Values.rtservice.partial.enable | default true | quote }}
            - name: RT_EMIT_EVERY_SEC
              value: {{ .Values.rtservice.partial.emitEverySec | default 0.7 | quote }}
            - name: RT_WINDOW_SEC
              value: {{ .Values.rtservice.partial.windowSec | default 5.0 | quote }}
            - name: RT_OVERLAP_SEC
              value: {{ .Values.rtservice.partial.overlapSec | default 0.5 | quote }}
            - name: RT_PARTIAL_MIN_BUFFER_SEC
              value: {{ .Values.rtservice.partial.minBufferSec | default 0.7 | quote }}
            - name: RT_PARTIAL_LOOKBACK_SEC
              value: {{ .Values.rtservice.partial.lookbackSec | default 2.0 | quote }}
            - name: RT_PARTIAL_MODE
              value: {{ .Values.rtservice.partial.mode | default "cumulative" | quote }}
            - name: RT_PARTIAL_MIN_TRANSCRIBE_SEC
              value: {{ .Values.rtservice.partial.minTranscribeSec | default 1.5 | quote }}
            - name: RT_PARTIAL_STABILITY_REPEATS
              value: {{ .Values.rtservice.partial.stabilityRepeats | default 1 | quote }}

            # Overload protection: skip PARTIALs when behind realtime.
            - name: RT_PARTIAL_MAX_BEHIND_SEC
              value: {{ .Values.rtservice.partial.maxBehindSec | default 2.0 | quote }}
            - name: RT_PARTIAL_IDLE_RESET_SEC
              value: {{ .Values.rtservice.partial.idleResetSec | default 3.0 | quote }}

            {{- if .Values.observability.enabled }}
            - name: OTEL_SERVICE_NAME
              value: "rtservice"
            {{- include "nanosamurai-stack.otelCommonEnv" . | nindent 12 }}
            {{- end }}
            {{- include "nanosamurai-stack.enrollmentEnv" . | nindent 12 }}
            - name: FW_LANG_DEFAULT
              value: ""

            {{- if .Values.hfCache.enabled }}
            - name: HF_HOME
              value: {{ .Values.hfCache.mountPath | quote }}
            {{- end }}

            {{- if .Values.rtservice.hfTokenSecret.name }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rtservice.hfTokenSecret.name | quote }}
                  key: {{ .Values.rtservice.hfTokenSecret.key | default "HF_TOKEN" | quote }}
            {{- else if .Values.rtservice.hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nanosamurai-stack.fullname" . }}-secrets
                  key: HF_TOKEN
            {{- end }}

          # rtservice can take a long time to start (model downloads / initialization).
          # Use a startupProbe to prevent the liveness probe from killing it during warmup.
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: {{ .Values.rtservice.startupProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.rtservice.startupProbe.failureThreshold | default 120 }}
            timeoutSeconds: {{ .Values.rtservice.startupProbe.timeoutSeconds | default 1 }}

          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10

          {{- if and .Values.rtservice.gpu.enabled (gt (int .Values.rtservice.gpu.count) 0) }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.rtservice.gpu.count }}
          {{- end }}

          {{- if .Values.hfCache.enabled }}
          volumeMounts:
            - name: hf-cache
              mountPath: {{ .Values.hfCache.mountPath | quote }}
          {{- end }}
      {{- if .Values.hfCache.enabled }}
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: {{ include "nanosamurai-stack.fullname" . }}-hf-cache-pvc
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nanosamurai-stack.fullname" . }}-rtservice
  labels:
    {{- include "nanosamurai-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: rtservice
spec:
  type: {{ .Values.rtservice.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rtservice
  ports:
    - name: grpc
      port: {{ .Values.rtservice.service.port }}
      targetPort: grpc
    {{- if .Values.rtservice.observability.metrics.enabled }}
    - name: metrics
      port: {{ .Values.rtservice.observability.metrics.port | default 8008 }}
      targetPort: metrics
    {{- end }}
{{- end }}
