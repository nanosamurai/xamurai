{{- if and .Values.rtservice.hfToken (not .Values.rtservice.hfTokenSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nanosamurai-stack.fullname" . }}-secrets
  labels:
    {{- include "nanosamurai-stack.labels" . | nindent 4 }}
type: Opaque
data:
  HF_TOKEN: {{ .Values.rtservice.hfToken | b64enc | quote }}
{{- end }}
