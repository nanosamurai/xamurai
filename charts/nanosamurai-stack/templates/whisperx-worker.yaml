{{- if .Values.whisperxWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nanosamurai-stack.fullname" . }}-whisperx-worker
  labels:
    {{- include "nanosamurai-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisperx-worker
spec:
  replicas: {{ .Values.whisperxWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: whisperx-worker
  template:
    metadata:
      labels:
        {{- include "nanosamurai-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: whisperx-worker
    spec:
      containers:
        - name: whisperx-worker
          image: "{{ .Values.images.whisperxWorker.repository }}:{{ .Values.images.whisperxWorker.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.infra.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC_AUDIO
              value: "audio.raw"
            - name: KAFKA_TOPIC_REFINED
              value: "transcripts.refined"

            {{- if .Values.hfCache.enabled }}
            - name: HF_HOME
              value: {{ .Values.hfCache.mountPath | quote }}
            {{- end }}
            - name: KAFKA_GROUP_ID
              value: "whisperx-async"
            - name: WHISPERX_SLICE_SECONDS
              value: "60.0"
            - name: WHISPERX_IDLE_SECONDS
              value: "30.0"
            - name: WHISPERX_COMPUTE_TYPE
              value: ""

            {{- include "nanosamurai-stack.enrollmentEnv" . | nindent 12 }}

          {{- if and .Values.whisperxWorker.gpu.enabled (gt (int .Values.whisperxWorker.gpu.count) 0) }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.whisperxWorker.gpu.count }}
          {{- end }}

          {{- if .Values.hfCache.enabled }}
          volumeMounts:
            - name: hf-cache
              mountPath: {{ .Values.hfCache.mountPath | quote }}
          {{- end }}
      {{- if .Values.hfCache.enabled }}
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: {{ include "nanosamurai-stack.fullname" . }}-hf-cache-pvc
      {{- end }}
{{- end }}
