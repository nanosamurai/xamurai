{{- if .Values.whisperxWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nanosamurai-stack.fullname" . }}-whisperx-worker
  labels:
    {{- include "nanosamurai-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisperx-worker
spec:
  replicas: {{ .Values.whisperxWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: whisperx-worker
  template:
    metadata:
      labels:
        {{- include "nanosamurai-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: whisperx-worker
    spec:
      containers:
        - name: whisperx-worker
          image: "{{ .Values.images.whisperxWorker.repository }}:{{ .Values.images.whisperxWorker.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.infra.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC_AUDIO
              value: "audio.raw"
            - name: KAFKA_TOPIC_REFINED
              value: "transcripts.refined"

            {{- if .Values.observability.enabled }}
            - name: OTEL_SERVICE_NAME
              value: "whisperx-worker"
            {{- include "nanosamurai-stack.otelCommonEnv" . | nindent 12 }}
            {{- end }}

            {{- if .Values.hfCache.enabled }}
            - name: HF_HOME
              value: {{ .Values.hfCache.mountPath | quote }}
            {{- end }}

            {{- if .Values.rtservice.hfTokenSecret.name }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rtservice.hfTokenSecret.name | quote }}
                  key: {{ .Values.rtservice.hfTokenSecret.key | default "HF_TOKEN" | quote }}
            {{- else if .Values.rtservice.hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nanosamurai-stack.fullname" . }}-secrets
                  key: HF_TOKEN
            {{- end }}

            - name: KAFKA_GROUP_ID
              value: "whisperx-async"
            - name: WHISPERX_SLICE_SECONDS
              value: "60.0"
            - name: WHISPERX_IDLE_SECONDS
              value: "30.0"
            - name: WHISPERX_COMPUTE_TYPE
              value: ""

            # Phase 2: decouple Kafka polling from inference.
            - name: WHISPERX_DECOUPLE_IO
              value: {{ .Values.whisperxWorker.decoupleIo | default false | quote }}

            # Commit offsets only after producing refined messages.
            - name: WHISPERX_COMMIT_AFTER_PRODUCE
              value: {{ .Values.whisperxWorker.commitAfterProduce | default true | quote }}

            # Scheduler-level dynamic batching knobs.
            - name: WHISPERX_BATCH_MAX_ITEMS
              value: {{ .Values.whisperxWorker.batch.maxItems | default 1 | quote }}
            - name: WHISPERX_BATCH_MAX_WAIT_MS
              value: {{ .Values.whisperxWorker.batch.maxWaitMs | default 30 | quote }}
            - name: WHISPERX_BATCH_MODE
              value: {{ .Values.whisperxWorker.batch.mode | default "sequential" | quote }}

            {{- include "nanosamurai-stack.enrollmentEnv" . | nindent 12 }}

          {{- if and .Values.whisperxWorker.gpu.enabled (gt (int .Values.whisperxWorker.gpu.count) 0) }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.whisperxWorker.gpu.count }}
          {{- end }}

          {{- if .Values.hfCache.enabled }}
          volumeMounts:
            - name: hf-cache
              mountPath: {{ .Values.hfCache.mountPath | quote }}
          {{- end }}
      {{- if .Values.hfCache.enabled }}
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: {{ include "nanosamurai-stack.fullname" . }}-hf-cache-pvc
      {{- end }}
{{- end }}
