name: Publish images (GHCR)

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit test gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  secret-scan:
    name: Gitleaks gate
    uses: ./.github/workflows/gitleaks.yml
    permissions:
      contents: read

  fastwhisper-integration:
    name: Fast-whisper integration gate
    uses: ./.github/workflows/integration-fastwhisper.yml
    permissions:
      contents: read
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  whisperx-integration:
    name: WhisperX integration gate
    uses: ./.github/workflows/integration-whisperx.yml
    permissions:
      contents: read
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  publish:
    name: Build + push images to GHCR
    needs:
      - unit-tests
      - secret-scan
      - fastwhisper-integration
      - whisperx-integration
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rtservice
            dockerfile: rtservice/Dockerfile
            context: .
            ghcr_repo: xamurai-rtservice
          - image: whisperx-worker
            dockerfile: whisperx_worker/Dockerfile
            context: .
            ghcr_repo: xamurai-whisperx-worker
          - image: recorder-worker
            dockerfile: recorder_worker/Dockerfile
            context: .
            ghcr_repo: xamurai-recorder-worker
          - image: finalizer-worker
            dockerfile: finalizer_worker/Dockerfile
            context: .
            ghcr_repo: xamurai-finalizer-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image tags
        id: tags
        run: |
          {
            echo "sha_tag=sha-${GITHUB_SHA}"
            echo "image_name=ghcr.io/nanosamurai/${{ matrix.ghcr_repo }}"
            echo "image_uri=ghcr.io/nanosamurai/${{ matrix.ghcr_repo }}:sha-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.image_uri }}

      - name: Export and validate SPDX SBOM
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.tags.outputs.image_name }}
          SBOM_PATH: ${{ runner.temp }}/${{ matrix.image }}.spdx.json
        run: |
          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --format "{{ json .SBOM.SPDX }}" \
            > "${SBOM_PATH}"
          jq -e \
            '.SPDXID == "SPDXRef-DOCUMENT" and ((.packages // []) | length > 0)' \
            "${SBOM_PATH}" > /dev/null

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: sbom-${{ matrix.image }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.image }}.spdx.json

      - name: Attest SPDX SBOM
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@v4
        with:
          push-to-registry: true
          sbom-path: ${{ runner.temp }}/${{ matrix.image }}.spdx.json
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ${{ steps.tags.outputs.image_name }}

      - name: Summary
        run: |
          {
            echo "Pushed: ${{ steps.tags.outputs.image_uri }}"
            echo "Digest: ${{ steps.build.outputs.digest }}"
            echo "SPDX SBOM: attached in GHCR and uploaded as a workflow artifact"
          } >> "$GITHUB_STEP_SUMMARY"
