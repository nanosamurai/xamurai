name: Publish images (GHCR)

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit test gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  secret-scan:
    name: Gitleaks gate
    uses: ./.github/workflows/gitleaks.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  fastwhisper-integration:
    name: Fast-whisper integration gate
    uses: ./.github/workflows/integration-fastwhisper.yml
    permissions:
      contents: read
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  whisperx-integration:
    name: WhisperX integration gate
    uses: ./.github/workflows/integration-whisperx.yml
    permissions:
      contents: read
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  publish:
    name: Build + push images to GHCR
    needs:
      - unit-tests
      - secret-scan
      - fastwhisper-integration
      - whisperx-integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rtservice
            dockerfile: rtservice/Dockerfile
            context: .
            ghcr_repo: xamurai-rtservice
          - image: whisperx-worker
            dockerfile: whisperx_worker/Dockerfile
            context: .
            ghcr_repo: xamurai-whisperx-worker
          - image: recorder-worker
            dockerfile: recorder_worker/Dockerfile
            context: .
            ghcr_repo: xamurai-recorder-worker
          - image: finalizer-worker
            dockerfile: finalizer_worker/Dockerfile
            context: .
            ghcr_repo: xamurai-finalizer-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          echo "sha_tag=sha-${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "image_uri=ghcr.io/nanosamurai/${{ matrix.ghcr_repo }}:sha-${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Docker build
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ steps.tags.outputs.image_uri }}" \
            "${{ matrix.context }}"

      - name: Docker push
        run: |
          docker push "${{ steps.tags.outputs.image_uri }}"

      - name: Summary
        run: |
          echo "Pushed: ${{ steps.tags.outputs.image_uri }}" >> $GITHUB_STEP_SUMMARY
