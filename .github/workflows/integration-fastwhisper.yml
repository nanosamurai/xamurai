name: Integration tests (fast-whisper / rtservice)

on:
  workflow_call:
    secrets:
      HF_TOKEN:
        required: true
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * *" # nightly-ish; adjust as needed

permissions:
  contents: read

concurrency:
  group: integration-fastwhisper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-integration-fastwhisper:
    name: rtservice integration (faster-whisper + pyannote)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (ffmpeg, libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install torch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0" \
            "torchaudio==2.8.0"

      - name: Install integration deps (fast-whisper)
        run: |
          pip install -r requirements.integration.fastwhisper.txt

      - name: Run integration tests (fast-whisper)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

          # Security: disable pyannote.audio telemetry/metrics exporter.
          PYANNOTE_METRICS_ENABLED: "0"

          # Keep CI feasible on CPU.
          RT_ASR_MODEL: "tiny"
        run: |
          pytest -q --maxfail=1 -o log_cli=true --log-cli-level=INFO \
            -m integration \
            tests/test_realtime_asr_grpc.py
