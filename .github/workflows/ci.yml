name: CI

on:
  pull_request:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python unit tests (lightweight)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt

      - name: Unit tests (exclude integration)
        run: |
          pytest -q -m "not integration" \
            tests/test_diarization_assign_unit.py \
            tests/test_enrollment_cache_unit.py \
            tests/test_rtservice_session_isolation_unit.py \
            tests/test_stream_controls_unit.py
