name: CI

on:
  pull_request:
    branches:
      - enable-realtime-replica-routing
      - master
      - implement-lean-final-tracks
      - validate-nemotron-realtime
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python unit tests (lightweight)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt

      - name: Unit tests (exclude integration)
        run: |
          pytest -q -m "not integration" \
            tests/test_diarization_assign_unit.py \
            tests/test_enrollment_cache_unit.py \
            tests/test_enrollment_audio_unit.py \
            tests/test_model_artifact_security.py \
            tests/test_rtservice_decode_config_unit.py \
            tests/test_rtservice_final_segmentation_unit.py \
            tests/test_rtservice_session_isolation_unit.py \
            tests/test_speech_provider_integration.py \
            tests/test_qwen_rtservice_integration.py \
            tests/test_nemotron_rtservice_integration.py \
            tests/test_nemotron_native_unit.py \
            tests/test_nemotron_speakers_unit.py \
            tests/test_whisperx_worker_unit.py \
            tests/test_whisperx_shared.py \
            tests/test_whisperx_shared_startup.py \
            tests/test_whisperx_alignment.py \
            tests/test_finalization_runtime.py \
            tests/test_finalization_concurrency.py \
            tests/test_finalization_publication.py \
            tests/test_stream_controls_unit.py

  recorder-integration:
    name: Recorder Kafka and S3 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fixtures remove their own containers. Avoid Ryuk's wildcard host binding.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install integration dependencies
        run: |
          python -m pip install -r requirements.integration.txt
          python -m pip check
      - name: Check recording completion and storage
        run: pytest -q -m integration tests/test_recorder_worker_integration.py
