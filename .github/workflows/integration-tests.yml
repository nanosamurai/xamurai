name: Integration tests (manual)

on:
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * *" # nightly-ish; adjust as needed

permissions:
  contents: read

jobs:
  python-integration:
    name: Python integration tests (Kafka/LocalStack, heavy deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Explain why this is manual
        run: |
          echo "Integration tests require Docker (testcontainers), and some require HF_TOKEN + heavy ML deps (torch/whisperx)."
          echo "We keep them out of the default PR gate to avoid flaky/slow CI."

      # NOTE:
      # - If/when we want these to run in CI, we should create a dedicated requirements file
      #   and likely use a self-hosted runner (GPU for whisperx tests).
      # - This workflow runs the integration marker set on GitHub-hosted runners.
      #   Heavy ML-backed tests are expected to be skipped until we add a self-hosted runner.
      - name: Run integration tests (best-effort)
        env:
          # Provide HF_TOKEN via repository/organization secret to enable diarization tests.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.integration.txt

          # Run *all* tests marked as integration.
          #
          # Notes:
          # - Some tests will be skipped unless heavy ML deps are available.
          # - We still run the full marker set so we learn what is runnable on
          #   GitHub-hosted runners vs what needs a self-hosted runner.
          # IMPORTANT:
          # Pytest still imports/collects non-integration test modules even
          # when selecting with `-m integration`. Some unit tests import heavy
          # deps (torch/whisperx) at module import time and would fail in CI.
          #
          # Therefore, we execute an explicit list of integration test files.
          # This is the "max possible" set for GitHub-hosted runners without
          # GPU/ML dependencies.
          pytest -q --maxfail=1 -o log_cli=true --log-cli-level=INFO \
            -m integration \
            tests/test_recorder_worker_integration.py \
            tests/test_realtime_asr_grpc.py \
            tests/test_whisperx_worker_integration.py \
            tests/test_finalizer_worker_integration.py
