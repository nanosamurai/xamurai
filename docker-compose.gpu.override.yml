services:
  rtservice:
    # Enable NVIDIA GPU for rtservice.
    #
    # Usage:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.override.yml up -d --build rtservice
    #
    # Requirements:
    # - NVIDIA driver installed on host
    # - Docker supports `--gpus` (nvidia-container-toolkit)
    gpus: all
