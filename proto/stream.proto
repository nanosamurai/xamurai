syntax = "proto3";
package stream;

// ~200–500 ms of PCM16 mono @16 kHz per message
message AudioChunk {
  string  session_id   = 1;
  uint64  seq          = 2;   // incremental per session
  int64   t0_ns        = 3;   // producer monotonic timestamp OR sample time
  uint32  sample_rate  = 4;   // 16000
  bytes   pcm16_le     = 5;   // little-endian PCM16 mono
}

enum AsrType { PARTIAL = 0; FINAL = 1; }

message AsrEvent {
  string  session_id = 1;
  double  start_s    = 2;
  double  end_s      = 3;
  string  text       = 4;
  AsrType type       = 5;
  string  lang       = 6; // optional (e.g., "cs")
  string speaker    = 7;
}

message DiarEvent {
  string  session_id = 1;
  double  start_s    = 2;
  double  end_s      = 3;
  string  speaker    = 4;   // "SPEAKER_00" or enrolled name
  float   confidence = 5;   // 0..1
}

message RefinedEvent {
  string  session_id   = 1;
  double  start_s      = 2;
  double  end_s        = 3;
  string  text         = 4;
  string  speaker      = 5;              // optional/mapped
  repeated uint64 supersedes_seq = 6;    // optional linkage to live lines
  string lang             = 7;
}

// Recording-level metadata: “recording finished, file is available”
message RecordingFinished {
  string session_id   = 1;
  string recording_url = 2;  // e.g. file://..., s3://...
  double duration_s   = 3;
  int32  sample_rate  = 4;
  string lang         = 5;

  // optional tenant/client label for downstream routing
  string tenant_id    = 6;

  int64 created_at_ns = 7;   // when this event was created
}

message WordAlignment {
  double start_s = 1;  // absolute word start time in seconds
  double end_s   = 2;  // absolute word end time in seconds
  string text    = 3;  // the word text (normalized)
}

message FinalEvent {
  string session_id = 1;

  double start_s    = 2;
  double end_s      = 3;

  string text       = 4;
  string speaker    = 5;
  string lang       = 6;

  repeated WordAlignment words = 7;
}

