name: drsynth-bff
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.13.5
  - numpy
  - scipy
  - libsndfile
  - pip
  - anaconda::ffmpeg
  - pip:
      - pyannote.audio
      - faster-whisper==1.*
      - sounddevice
      - soundfile
      - omegaconf

      - # Web API / WS
      - fastapi>=0.115
      - uvicorn[standard]>=0.30

      - # Messaging / proto
      - confluent-kafka>=2.0
      - pydantic>=2.8
      - protobuf>=5.29
      - grpcio-tools>=1.62

