<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OIDC Callback</title>
</head>
<body>
  <div>Completing login…</div>

<script>
const KEYCLOAK_ISSUER = "https://auth.nanosamur.ai/realms/nanosamurai";
const CLIENT_ID = "bff-web";
const REDIRECT_URI = `${location.origin}/ui/callback.html`;

function qs(name){ return new URLSearchParams(location.search).get(name); }

(async () => {
  const code = qs("code");
  const state = qs("state");
  const err = qs("error");

  if (err) {
    document.body.innerText = "Login error: " + err + " " + (qs("error_description") || "");
    return;
  }
  if (!code) {
    document.body.innerText = "No authorization code in callback.";
    return;
  }

  // anti-CSRF check
  const expectedState = sessionStorage.getItem("pkce_state");
  if (!expectedState || expectedState !== state) {
    document.body.innerText = "State mismatch.";
    return;
  }

  const verifier = sessionStorage.getItem("pkce_verifier");
  if (!verifier) {
    document.body.innerText = "Missing PKCE verifier.";
    return;
  }

  const tokenUrl = `${KEYCLOAK_ISSUER}/protocol/openid-connect/token`;

  const body = new URLSearchParams();
  body.set("grant_type", "authorization_code");
  body.set("client_id", CLIENT_ID);
  body.set("code", code);
  body.set("redirect_uri", REDIRECT_URI);
  body.set("code_verifier", verifier);

  const resp = await fetch(tokenUrl, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString(),
  });

  if (!resp.ok) {
    const txt = await resp.text();
    document.body.innerText = "Token exchange failed: " + resp.status + "\n" + txt;
    return;
  }

  const token = await resp.json();

  // store tokens (dev-only: sessionStorage)
  sessionStorage.setItem("access_token", token.access_token);
  sessionStorage.setItem("id_token", token.id_token || "");
  sessionStorage.setItem("refresh_token", token.refresh_token || "");

  // cleanup transient PKCE stuff
  sessionStorage.removeItem("pkce_verifier");
  sessionStorage.removeItem("pkce_state");

  // back to UI
  location.href = "/ui/";
})();
</script>
</body>
</html>
