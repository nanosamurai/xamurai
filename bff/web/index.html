<!doctype html>
<meta charset="utf-8">
<title>WS Mic → PCM16 → BFF</title>
<body>
  <h3>Mic → WebSocket → BFF</h3>
  <label>Session ID: <input id="sid" value="test1"></label>

  <div>
    <label>Language:
      <select id="langSelect">
        <option value="cs" selected>Czech (cs)</option>
        <option value="en">English (en)</option>
        <option value="">Auto</option>
      </select>
    </label>
  </div>

  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <button id="clear">Clear logs</button>

  <div style="display:flex; gap:16px; margin-top:12px;">
    <div style="flex:1; min-width:0;">
      <h4>Realtime ASR</h4>
      <pre id="asr_log"
           style="height: 260px; overflow:auto; border:1px solid #ccc; padding:8px; white-space:pre-wrap;"></pre>
    </div>
    <div style="flex:1; min-width:0;">
      <h4>Refined (offline / WhisperX)</h4>
      <pre id="refined_log"
           style="height: 260px; overflow:auto; border:1px solid #ccc; padding:8px; white-space:pre-wrap;"></pre>
    </div>
  </div>

<script>
let ws, ac, media, node, running = false;

// Converts Float32Array [-1,1] to Int16Array little-endian
function floatTo16le(float32) {
  const out = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    let s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return out;
}

// Simple downsampler 48k -> 16k (factor 3). For other rates, we fallback to naive scale.
function downsampleTo16k(input, inRate) {
  if (inRate === 48000) {
    const out = new Float32Array(Math.floor(input.length / 3));
    let j = 0;
    for (let i = 0; i + 2 < input.length; i += 3) out[j++] = input[i]; // decimate
    return out;
  } else if (inRate === 16000) {
    return input;
  } else {
    // naive linear-resample (good enough for testing)
    const ratio = 16000 / inRate;
    const out = new Float32Array(Math.floor(input.length * ratio));
    for (let i = 0; i < out.length; i++) {
      const t = i / ratio;
      const i0 = Math.floor(t);
      const frac = t - i0;
      const s0 = input[i0] || 0, s1 = input[i0 + 1] || 0;
      out[i] = s0 + (s1 - s0) * frac;
    }
    return out;
  }
}

// Append text to a specific <pre>
function appendLine(id, s) {
  const el = document.getElementById(id);
  el.textContent += s + "\n";
  el.scrollTop = el.scrollHeight;
}

function clearLogs() {
  document.getElementById('asr_log').textContent = "";
  document.getElementById('refined_log').textContent = "";
}

async function start() {
  if (running) return;
  running = true;
  document.getElementById('start').disabled = true;
  document.getElementById('stop').disabled = false;

  const sid = document.getElementById('sid').value || 'test1';
  const lang = document.getElementById("langSelect").value;

  ws = new WebSocket(`ws://${location.host}/ws?session_id=${encodeURIComponent(sid)}&session_lang=${encodeURIComponent(lang)}`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    appendLine('asr_log', "[ws] connected");
  };

  ws.onclose = () => {
    appendLine('asr_log', "[ws] closed");
  };

  ws.onerror = (e) => {
    appendLine('asr_log', "[ws] error: " + e.toString());
  };

  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);

      if (msg.type === "asr") {
        // Realtime ASR event
        const tag = msg.final ? "FINAL" : "PARTIAL";
        const start = typeof msg.start_s === "number" ? msg.start_s : Number(msg.start_s || 0);
        const end   = typeof msg.end_s === "number" ? msg.end_s : Number(msg.end_s || 0);
        const speaker = msg.speaker || "UNK";
        const ts = `[${tag} ${start.toFixed(2)}–${end.toFixed(2)}]`;
        appendLine("asr_log", `${ts} ${speaker}: ${msg.text}`);
      } else if (msg.type === "refined") {
        // Offline WhisperX-refined event
        const start = typeof msg.start_s === "number" ? msg.start_s : Number(msg.start_s || 0);
        const end   = typeof msg.end_s === "number" ? msg.end_s : Number(msg.end_s || 0);
        const speaker = msg.speaker || "UNK";
        const ts = `[REFINED ${start.toFixed(2)}–${end.toFixed(2)}]`;
        appendLine("refined_log", `${ts} ${speaker}: ${msg.text}`);
      } else {
        // Unknown message type: dump to ASR log
        appendLine("asr_log", ev.data);
      }
    } catch (e) {
      // fallback if parsing fails
      appendLine("asr_log", ev.data);
    }
  };

  ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  media = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, noiseSuppression: false, echoCancellation: false },
    video: false
  });

  const src = ac.createMediaStreamSource(media);

  // ScriptProcessor is deprecated but simplest for a quick test
  // Buffer size 2048 @ 48k ≈ 42.7 ms. BFF is fine with any frame length.
  node = ac.createScriptProcessor(2048, 1, 1);
  src.connect(node);
  node.connect(ac.destination); // or ac.createGain() if you don't want to hear yourself

  node.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== 1) return;
    const ch0 = e.inputBuffer.getChannelData(0);
    const ds = downsampleTo16k(ch0, ac.sampleRate);
    const i16 = floatTo16le(ds);
    ws.send(i16.buffer);
  };
}

function stop() {
  running = false;
  document.getElementById('start').disabled = false;
  document.getElementById('stop').disabled = true;

  try { node && node.disconnect(); } catch(e){}
  try { media && media.getTracks().forEach(t => t.stop()); } catch(e){}
  try { ac && ac.close(); } catch(e){}
  try { ws && ws.close(); } catch(e){}

  appendLine('asr_log', "[stopped]");
}

document.getElementById('start').onclick = start;
document.getElementById('stop').onclick = stop;
document.getElementById('clear').onclick = clearLogs;
</script>
</body>
