[pytest]
# Keep default test discovery scoped to our test suite.
# The repo contains various utility scripts that may import heavyweight
# dependencies (torch, faster-whisper, confluent-kafka, …) that are not
# available in all dev environments.

markers =
    integration: tests that require external services (Kafka, LocalStack) and/or heavy ML deps
    timeout: per-test timeout marker (requires pytest-timeout plugin to enforce)

testpaths =
    tests

# Only treat files under testpaths as tests.
python_files = test_*.py

# Avoid collecting helper scripts as tests.
norecursedirs =
    utilities
    whisperx_worker/src/whisperx_worker
